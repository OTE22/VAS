# /etc/nginx/nginx.conf
# Production-scale NGINX reverse proxy for your stack (FastAPI/Gunicorn + WebSockets + uploads)
# IMPORTANT: in Docker Compose, upstream MUST use the *service name* (not container_name).
# In your compose, service name is: face_recognition  (container_name is face_recognition_api)
# So upstream should be: face_recognition:8000

user  nginx;
worker_processes auto;
pid /var/run/nginx.pid;

error_log  /var/log/nginx/error.log warn;

events {
  worker_connections  8192;
  multi_accept on;
  use epoll;  # ignored on non-Linux, fine
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  server_tokens off;

  # Logging
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time uct=$upstream_connect_time '
                  'uht=$upstream_header_time urt=$upstream_response_time';

  access_log /var/log/nginx/access.log main;

  # Performance
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  keepalive_timeout 65;
  keepalive_requests 1000;

  # If you have big image payloads/base64, raise this.
  client_max_body_size 200M;
  client_body_buffer_size 512k;

  # Timeouts (production-friendly for inference)
  client_body_timeout 60s;
  client_header_timeout 60s;
  send_timeout 60s;

  # Buffers (tune for large headers if needed)
  client_header_buffer_size 8k;
  large_client_header_buffers 4 32k;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/xml
    application/xml+rss application/rss+xml
    image/svg+xml;

  # Docker internal DNS resolver (helps avoid "host not found" on startup)
  # This makes NGINX re-resolve service names dynamically.
  resolver 127.0.0.11 ipv6=off valid=10s;
  resolver_timeout 5s;

  # Upstream to your FastAPI service
  upstream face_recognition_backend {
    zone face_recognition_backend 64k;
    least_conn;

    # Use service name "face_recognition" (from compose), not container_name.
    # "resolve" ensures DNS refresh if container IP changes.
    server face_recognition:8000 resolve max_fails=3 fail_timeout=10s;

    keepalive 128;
  }

  # Map for websocket connection header
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Rate limiting zones (optional, but production-safe)
  # Adjust rate to your usage.
  limit_req_zone $binary_remote_addr zone=api_rate:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  # Authentication endpoints get their own, far stricter budget: credential
  # submission is never a high-rate operation, and this is the outermost
  # layer of brute-force defence (the API also enforces per-account and
  # per-IP throttling in Redis, which survives nginx reloads).
  limit_req_zone $binary_remote_addr zone=auth_rate:10m rate=10r/m;

  # Real client IP configuration (for proper logging and rate limiting)
  real_ip_header X-Forwarded-For;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 10.0.0.0/8;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Basic hardening headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Health endpoints (fast pass-through; Connection "" keeps upstream keepalive)
    location = /health/live {
      proxy_pass http://face_recognition_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
      access_log off;
    }

    location = /health/ready {
      proxy_pass http://face_recognition_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 15s;
      access_log off;
    }

    location = /health {
      proxy_pass http://face_recognition_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      access_log off;
    }

    # WebSocket endpoints - handle both /ws and /ws/
    location /ws {
      # Optional: limit per IP
      limit_conn conn_limit 50;

      proxy_pass http://face_recognition_backend;
      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Prevent caching of WebSocket connections
      proxy_cache_bypass $http_upgrade;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Metrics pass-through
    location /metrics {
      proxy_pass http://face_recognition_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
    }

    # Static files - served directly by nginx for performance
    # CRITICAL: must come BEFORE the catch-all location block.
    # ^~ prefix match covers EVERYTHING under /frontend/ (css, js, vendor,
    # components, fonts, webfonts, html) so no static asset ever reaches Python.
    location ^~ /frontend/ {
      root /usr/share/nginx/html;
      try_files $uri =404;
      charset utf-8;
      expires 1y;
      add_header Cache-Control "public, immutable";
      add_header Access-Control-Allow-Origin *;
      add_header X-Content-Type-Options nosniff;
      access_log off;
    }

    # Icons directory - use ^~ for priority prefix matching
    location ^~ /icons/ {
      root /usr/share/nginx/html;
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log on;
    }

    # Favicon
    location = /favicon.ico {
      root /usr/share/nginx/html;
      try_files /icons/favicon.ico =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    # Authentication endpoints — strict rate limit, never cached.
    # MUST come before the general /api location so it matches first.
    location ~ ^/api/auth/(login|logout)$ {
      # 10 requests/minute per source, small burst for legitimate retries.
      # nodelay so the 11th attempt is rejected immediately rather than queued.
      limit_req zone=auth_rate burst=5 nodelay;
      limit_req_status 429;
      limit_conn conn_limit 20;

      # Credentials must never be written to any cache, proxy or browser store
      proxy_no_cache 1;
      proxy_cache_bypass 1;
      add_header Cache-Control "no-store" always;
      add_header Pragma "no-cache" always;

      # Cap the request body: credentials are tiny, so anything larger is abuse
      client_max_body_size 16k;

      proxy_pass http://face_recognition_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Forward Origin/Referer so the API can enforce login-CSRF checks
      proxy_set_header Origin $http_origin;
      proxy_set_header Referer $http_referer;
      proxy_set_header Authorization $http_authorization;

      # bcrypt verification is intentionally slow; allow for it but no longer
      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    # SSE Streaming endpoint - MUST disable buffering for real-time streaming
    # This MUST come BEFORE the general API location block to match first
    location ~ ^/api/sql-agent/query/stream$ {
      # Adjusted rate limiting for AI inference (long requests)
      limit_req zone=api_rate burst=120 delay=20;
      limit_conn conn_limit 200;

      proxy_pass http://face_recognition_backend;
      proxy_http_version 1.1;

      # CRITICAL: Disable connection close by proxy for SSE
      # Empty Connection header prevents Nginx from adding "Connection: close"
      proxy_set_header Connection "";

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;

      # CRITICAL: Disable buffering for SSE streaming
      proxy_buffering off;
      proxy_cache off;
      proxy_request_buffering off;

      # Extended timeouts for long-running streams (1 hour for very long queries)
      proxy_connect_timeout 30s;
      proxy_send_timeout 3600s;  # 1 hour for streaming
      proxy_read_timeout 3600s;  # 1 hour for streaming
      send_timeout 3600s;        # 1 hour timeout

      # Disable gzip for SSE (breaks streaming - gzip buffers data)
      gzip off;
    }

    # Webhook ingestion - dedicated location: bounded body size, short timeouts
    # (the handler now answers 202 in milliseconds), buffering on.
    location ~ ^/(api/)?webhook/ {
      limit_req zone=api_rate burst=120 delay=20;
      limit_conn conn_limit 200;

      client_max_body_size 25m;

      proxy_pass http://face_recognition_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;

      proxy_connect_timeout 10s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;

      proxy_buffering on;
      proxy_request_buffering on;
    }

    # API routes - proxy to FastAPI backend
    location ~ ^/(api|docs|redoc|openapi\.json) {
      # Adjusted rate limiting for AI inference (long requests)
      limit_req zone=api_rate burst=120 delay=20;
      limit_conn conn_limit 200;

      proxy_pass http://face_recognition_backend;
      proxy_http_version 1.1;

      # Keep upstream connections alive (the upgrade map lives ONLY in /ws;
      # "Connection: upgrade/close" here defeated the keepalive pool entirely)
      proxy_set_header Connection "";

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;

      # Timeouts (inference may take time - CPU LLM queries can run several minutes;
      # must be >= gunicorn timeout of 600s so nginx doesn't cut off in-flight requests)
      proxy_connect_timeout 30s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;

      # Buffers
      proxy_buffering on;
      proxy_buffer_size 16k;
      proxy_buffers 32 16k;
      proxy_busy_buffers_size 64k;

      # Helps with big uploads
      proxy_request_buffering on;
    }

    # Default: proxy everything else to FastAPI (for backward compatibility)
    location / {
      # Adjusted rate limiting for AI inference (long requests)
      limit_req zone=api_rate burst=120 delay=20;
      limit_conn conn_limit 200;

      proxy_pass http://face_recognition_backend;
      proxy_http_version 1.1;

      # Plain HTTP pages - keep upstream keepalive (no upgrade header here)
      proxy_set_header Connection "";

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;

      proxy_connect_timeout 30s;
      proxy_send_timeout 180s;
      proxy_read_timeout 180s;

      proxy_buffering on;
      proxy_buffer_size 16k;
      proxy_buffers 32 16k;
      proxy_busy_buffers_size 64k;
      proxy_request_buffering on;
    }
  }
}
