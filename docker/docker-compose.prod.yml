# =============================================================================
# PRODUCTION (CPU) — Face Recognition Service
# =============================================================================
# Differs from docker-compose.cpu.yml (development) in every way that matters:
#   * ENVIRONMENT=production, so the fail-closed configuration preflight is armed
#   * secrets come from Docker secrets and ${VAR}, never literals
#   * no whole-repo bind mount, so the image is immutable
#   * Postgres, Redis and Ollama publish no host ports
#   * TLS terminates in nginx; only 80/443 are published
#   * segmented networks: nginx cannot reach the database
#   * a one-shot migrate job gates the API
#   * the application connects as fr_app, not the postgres superuser
#
# Prerequisites, in order:
#   bash scripts/setup/generate-secrets.sh        # secrets/ + docker/redis/users.acl
#   bash scripts/tls/make-internal-ca.sh face-detector.internal <lan-ip>
#   docker compose -f docker/docker-compose.prod.yml exec -T postgres \
#     psql -U postgres -d face_recognition -f /db/roles.sql   # see db/roles.sql
#
# Deploy:
#   docker compose -f docker/docker-compose.prod.yml up -d --build
#
# The stack refuses to start if any secret is missing. That is intended.
# =============================================================================

# The project name namespaces every volume, network and container. It is NOT
# cosmetic: without it Compose derives the project from this file's parent
# directory — "docker" — and so did docker-compose.cpu.yml. Both declare
# volumes named postgres_data, redis_data, face_database_data and
# chromadb_cache, so both resolved to docker_postgres_data &c. and STARTING
# PRODUCTION MOUNTED THE DEVELOPMENT DATABASE.
#
# face_detector_dev / face_detector_prod keep the two stacks on disjoint
# volumes. Deliberately not plain "face_detector": volumes under that prefix
# already exist on some hosts from an older layout, and adopting them silently
# would resurrect stale data — the same failure in a different costume.
#
# docker-compose.prod.gpu.yml intentionally omits `name:`. Compose merges the
# top-level name last-wins and an absent key does not override, so the
# prod + prod.gpu pair inherits this one.
#
# Never set COMPOSE_PROJECT_NAME: it outranks this key.
name: face_detector_prod

services:
  postgres:
    image: pgvector/pgvector:pg15
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_statement=ddl
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: face_recognition
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - ../db:/db:ro
    # No published port. Postgres enforces none of the application's
    # authorization rules, so a reachable port bypasses all of them.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d face_recognition"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    restart: unless-stopped
    networks:
      - data

  redis:
    image: redis:7-alpine
    environment:
      # Used only by the healthcheck, so the password never appears as a
      # command-line argument visible in `docker inspect` or the host ps table.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: >
      redis-server
      --aclfile /etc/redis/users.acl
      --protected-mode yes
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 60 1000
      --tcp-keepalive 300
    volumes:
      - redis_data:/data
      - ./redis/users.acl:/etc/redis/users.acl:ro
    # Holds sessions, login rate-limit counters and the JWT revocation
    # denylist. AOF persistence is required: losing the denylist on restart
    # would silently resurrect tokens that had been logged out.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -u redis://fr_app:${REDIS_PASSWORD}@127.0.0.1:6379 ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2560M
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    restart: unless-stopped
    networks:
      - data

  # One-shot schema migration. Runs as the migration role, exits, and gates the
  # API so replicas can never race each other applying the same revision.
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
    restart: "no"
    user: "1000:1000"
    environment:
      ENVIRONMENT: production
      MIGRATIONS_MODE: run
      MIGRATIONS_EXPECTED_HEAD: ${MIGRATIONS_EXPECTED_HEAD:-fbb2c3d4e5f6}
      DATABASE_URL: postgresql+asyncpg://fr_migrator:${FR_MIGRATOR_PASSWORD:?set FR_MIGRATOR_PASSWORD in .env}@postgres:5432/face_recognition
      POSTGRES_USER: fr_migrator
      POSTGRES_PASSWORD: ${FR_MIGRATOR_PASSWORD}
      REDIS_URL: redis://fr_app:${REDIS_PASSWORD}@redis:6379/0
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN e.g. https://face-detector.internal}
      AUTH_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN}
      AUTH_SAME_HOST_ORIGIN_TRUSTED: "false"
      AUTH_COOKIE_SECURE: "true"
      ENABLE_API_DOCS: "false"
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret
      # migrate runs the production config preflight (unlike ml_worker, which
      # sets CONFIG_PREFLIGHT=0), so it needs the SQL-agent role and webhook
      # config or startup fails closed.
      SQL_AGENT_DB_USER: fr_readonly
      SQL_AGENT_DB_PASSWORD: ${FR_READONLY_PASSWORD:?set FR_READONLY_PASSWORD in .env}
      WEBHOOK_API_KEYS_FILE: /run/secrets/webhook_api_keys
      WORKERS: "1"
    secrets:
      - jwt_secret
      - webhook_api_keys
    command: ["python", "-m", "backend.utils.migrations", "--upgrade-head"]
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      - data

  face_recognition:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
    user: "1000:1000"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      PYTHONUNBUFFERED: "1"
      HOST: 0.0.0.0
      PORT: 8000
      # Must stay 1 while runtime settings, the SQL-agent cancellation
      # registry, the single-flight job guards, webhook dedup and FAISS
      # autosave remain process-local. See backend/core/runtime_settings.py.
      WORKERS: 1
      USE_GPU: "false"

      # --- secrets ---
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret
      BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      BOOTSTRAP_ADMIN_REQUIRE_ROTATION: "true"

      # --- least-privilege database role ---
      DATABASE_URL: postgresql+asyncpg://fr_app:${FR_APP_PASSWORD:?set FR_APP_PASSWORD in .env}@postgres:5432/face_recognition
      POSTGRES_USER: fr_app
      POSTGRES_PASSWORD: ${FR_APP_PASSWORD}
      POSTGRES_DB: face_recognition
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_POOL_SIZE: 30
      DB_MAX_OVERFLOW: 60
      DB_POOL_RECYCLE: 3600
      DB_POOL_PRE_PING: "true"

      REDIS_URL: redis://fr_app:${REDIS_PASSWORD}@redis:6379/0
      REDIS_MAX_CONNECTIONS: 50
      REDIS_POOL_SIZE: 25
      CACHE_TTL: 3600

      # --- TLS-dependent auth posture ---
      AUTH_COOKIE_SECURE: "true"
      AUTH_COOKIE_SAMESITE: strict
      AUTH_COOKIE_HOST_PREFIX: "true"
      AUTH_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN}
      AUTH_SAME_HOST_ORIGIN_TRUSTED: "false"
      CORS_ORIGINS: ${PUBLIC_ORIGIN}
      ENABLE_API_DOCS: "false"

      # LLM-generated SQL runs as a SELECT-only role, never as fr_app. The AST
      # guard is the first layer; this is the one a validator bug cannot
      # defeat. Required in production — the config guard refuses to start
      # without it.
      SQL_AGENT_DB_USER: fr_readonly
      SQL_AGENT_DB_PASSWORD: ${FR_READONLY_PASSWORD:?set FR_READONLY_PASSWORD in .env}

      # The migrate job already applied and verified; workers only re-check.
      MIGRATIONS_MODE: verify
      MIGRATIONS_EXPECTED_HEAD: ${MIGRATIONS_EXPECTED_HEAD:-fbb2c3d4e5f6}

      DETECTION_MODEL: /app/weights/det_10g.onnx
      RECOGNITION_MODEL: /app/weights/w600k_r50.onnx
      SIMILARITY_THRESHOLD: 0.4
      CONFIDENCE_THRESHOLD: 0.5
      # STORAGE_DIR is the only settable storage root. FACES_DIR,
      # UPLOAD_TEMP_DIR, WEBHOOK_IMAGES_DIR and CROPPED_IMAGES_DIR are
      # derived from it in config.py; setting them here has no effect
      # and config_guard refuses to start on a divergent value.
      STORAGE_DIR: /app/storage
      VECTOR_BACKEND: pgvector
      PGVECTOR_INDEX_TYPE: hnsw
      # Baked into the built index (apply_mode: index_rebuild), so these decide
      # production RECALL. Both other stacks set 32/128; production was
      # inheriting config.py's 16/100 by saying nothing, which meant the recall
      # measured during testing was not the recall production would deliver.
      # Stated explicitly here so the value is a decision, not an omission.
      PGVECTOR_HNSW_M: "32"
      PGVECTOR_HNSW_EF_CONSTRUCTION: "128"
      MAX_QUEUE_SIZE: 2000
      QUEUE_WORKERS: 15
      INFERENCE_WORKERS: 3
      MAX_CONCURRENT_INFERENCE: 3
      SAVE_WEBHOOK_IMAGES: "false"
      SAVE_CROPPED_IMAGES: "false"
      # Ingest authentication. The key never appears here - config_guard refuses
      # to start in production without one, and rejects weak or reused values.
      # Senders present the credential as `Authorization: Bearer <token>` or
      # `X-Webhook-Key: <token>`. WEBHOOK_AUTH_TOKEN is an accepted alias env
      # var that folds into the key set above. `off` is refused in production.
      WEBHOOK_AUTH_MODE: enforce
      WEBHOOK_API_KEYS_FILE: /run/secrets/webhook_api_keys
      DATA_RETENTION_DAYS: 30
      # Reporting only: the denominator behind storage usage_percent in
      # /api/stats. It deletes nothing. Set here so the production dashboard
      # measures against the same ceiling as every other stack, which was not
      # the case while prod inherited config.py's 500.
      MAX_STORAGE_GB: 5000
      LOG_LEVEL: INFO
      LOG_DIR: /var/log/face-recognition
      # Sentence-transformer / HuggingFace model cache. Declared here so the
      # location is configuration rather than a library default nobody can
      # find. Identical across cpu/gpu/prod; docker-entrypoint.sh creates it,
      # chowns it to appuser, and refuses to start if it is not writable.
      HF_HOME: /home/appuser/.cache/huggingface
      # tqdm progress bars ("Loading weights", "Batches") are terminal UI;
      # in a container they only shred the logs.
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:1.5b
      OLLAMA_SQL_MODEL: hf.co/mradermacher/Arctic-Text2SQL-R1-7B-GGUF:Q4_K_M
      CHROMADB_PATH: /app/database/chromadb
    secrets:
      - jwt_secret
      - bootstrap_admin_password
      - webhook_api_keys
    volumes:
      # Named volumes and read-only mounts only. The development stack's
      # `../:/app` is deliberately absent: a production image must be
      # immutable, and that mount also injected .env into the container.
      - ../weights:/app/weights:ro
      - storage_data:/app/storage
      # LOG_DIR on a persistent named volume — the rotating log set must
      # survive container recreation, since /api/logs is the only way an
      # operator reads it back.
      - logs_data:/var/log/face-recognition
      - face_database_data:/app/database
      # ML model registry artifacts, Parquet dataset snapshots and their
      # manifests (ML_ARTIFACT_DIR = /app/models/ml). The database registry
      # references these files by hash; without a persistent mount a
      # container recreate would leave every registered model/dataset row
      # pointing at a file that no longer exists.
      - ml_artifacts_data:/app/models/ml
      - chromadb_cache:/home/appuser/.cache/chroma
      # Read-only, purely so the operational metrics can report backup age and
      # certificate expiry. Without these the corresponding gauges stay unset
      # and their alerts can never fire.
      - backup_data:/backups:ro
      - ../certs:/etc/nginx/certs:ro
      # Offline basemap archives (MAP_DATA_DIR): the API's own map verify gate
      # (POST /api/maps/verify, scripts/map_data/production_gate.py) and the
      # /health/detailed map block read them. Without this mount the runbook's
      # own verification step has nothing to measure.
      - ../map-data:/app/map-data:ro
      # sentence-transformers MiniLM cache (HF_HOME): without a volume the
      # ~90 MB model re-downloads on every container recreate - and never
      # arrives at all on an offline host.
      - hf_cache_data:/home/appuser/.cache/huggingface
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    stop_grace_period: 75s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    restart: unless-stopped
    networks:
      - edge        # nginx -> API
      - data        # API -> postgres/redis
      - ai          # API -> ollama
      - monitoring  # prometheus -> API /metrics

  # Durable control-plane worker for CPU/file-heavy ML operations. It has no
  # inbound port and no edge/AI network access. The API only inserts commands
  # into PostgreSQL; this service leases and executes them in child processes.
  ml_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
    user: "1000:1000"
    environment:
      ENVIRONMENT: production
      PYTHONUNBUFFERED: "1"
      # This process serves no traffic. The API container owns the full HTTP
      # security preflight; the worker receives only its database/runtime
      # configuration and remains unreachable from the edge network.
      CONFIG_PREFLIGHT: "0"
      MIGRATIONS_MODE: verify
      MIGRATIONS_EXPECTED_HEAD: ${MIGRATIONS_EXPECTED_HEAD:-fbb2c3d4e5f6}
      DATABASE_URL: postgresql+asyncpg://fr_app:${FR_APP_PASSWORD:?set FR_APP_PASSWORD in .env}@postgres:5432/face_recognition
      POSTGRES_USER: fr_app
      POSTGRES_PASSWORD: ${FR_APP_PASSWORD}
      POSTGRES_DB: face_recognition
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 5
      DB_POOL_PRE_PING: "true"
      # This topology intentionally runs one serialized worker. Give it a
      # stable identity so container replacements update one heartbeat row.
      ML_WORKER_ID: ml-worker-production-primary
      ML_ARTIFACT_DIR: /app/models/ml
      LOG_LEVEL: INFO
      LOG_DIR: /var/log/face-recognition
      HF_HOME: /home/appuser/.cache/huggingface
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    volumes:
      - ml_artifacts_data:/app/models/ml
      - logs_data:/var/log/face-recognition
      - hf_cache_data:/home/appuser/.cache/huggingface
    command: ["python", "-m", "backend.ml.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 4G }
        reservations: { cpus: '0.5', memory: 1G }
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    restart: unless-stopped
    networks:
      - data

  ollama:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODELS=/root/.ollama/models
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
    restart: unless-stopped
    networks:
      - ai

  # ---------------------------------------------------------------------------
  # Martin — offline tile server for the MapLibre maps.
  #
  # Serves the prepared Lebanon datasets in ./map-data/production (mounted
  # read-only; data lives outside image layers and survives down/up
  # --force-recreate). Reachable ONLY through nginx at /maps/ — no host port,
  # so the browser never sees martin:3000. Configuration is explicit
  # (config/martin.yaml, validated against this exact image tag); nothing is
  # auto-detected and nothing is downloaded at start-up.
  #
  # Air-gapped hosts: `docker save ghcr.io/maplibre/martin:1.13.0 -o martin.tar`
  # on the connected machine, `docker load -i martin.tar` on the target.
  # ---------------------------------------------------------------------------
  martin:
    image: ghcr.io/maplibre/martin:1.13.0
    command: ["--config", "/config/martin.yaml"]
    volumes:
      - ../map-data:/map-data:ro
      - ../config/martin.yaml:/config/martin.yaml:ro
    # A REAL readiness probe: Martin's /health only answers once the config is
    # parsed and every configured source has been opened. wget is present in
    # the image; curl is not.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
    # edge, deliberately: nginx (edge-only) proxies /maps/ to martin and
    # depends_on its health - an undeclared/other network here made the whole
    # prod file unparseable and would have isolated martin from its one client.
    networks:
      - edge

  nginx:
    image: nginx:alpine
    volumes:
      - ../nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ../frontend:/usr/share/nginx/html/frontend:ro
      - ../icons:/usr/share/nginx/html/icons:ro
      # Offline Lebanon basemap — same host directory the API mounts read-only;
      # nginx serves it so tile bursts never touch gunicorn or rate limits.
      - ../certs:/etc/nginx/certs:ro
    # The only service that publishes host ports.
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      face_recognition:
        condition: service_healthy
      # /maps/ is proxied to Martin; do not accept traffic before it can
      # serve tiles, or the first map view is a wall of 502s.
      martin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    restart: unless-stopped
    # `edge` only: nginx has no route to postgres or redis, so a compromised
    # nginx cannot reach the datastores directly. webhook_integration adds the
    # VMS webhook ingress path WITHOUT weakening that: only nginx joins it, and
    # the segmented internal networks stay unreachable from VMS.
    networks:
      edge:
      webhook_integration:
        aliases:
          - face-webhook

  backup:
    image: postgres:15-alpine
    environment:
      PGHOST: postgres
      PGUSER: fr_backup
      PGPASSWORD: ${FR_BACKUP_PASSWORD:?set FR_BACKUP_PASSWORD in .env}
      PGDATABASE: face_recognition
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ../scripts/backup:/scripts:ro
      - backup_data:/backups
      - storage_data:/data/storage:ro
      - face_database_data:/data/database:ro
      # ML registry artifacts + Parquet datasets (ml_artifacts_data): the DB
      # references these files by sha256; they are unrecoverable if only the
      # database is restored.
      - ml_artifacts_data:/data/ml:ro
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    restart: unless-stopped
    networks:
      - data

  prometheus:
    image: prom/prometheus:v3.14.0
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=0.0.0.0:9090
    expose:
      - "9090"
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
    restart: unless-stopped
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    # Bound to loopback: reach it with an SSH tunnel rather than exposing
    # another authenticated surface on the LAN.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
    restart: unless-stopped
    networks:
      - monitoring

secrets:
  jwt_secret:
    file: ../secrets/jwt_secret
  bootstrap_admin_password:
    file: ../secrets/bootstrap_admin_password
  # Comma-separated ingest keys. Multiple values are the rotation story: append
  # the new key, roll it out to the cameras, then drop the old one.
  webhook_api_keys:
    file: ../secrets/webhook_api_keys

volumes:
  postgres_data: { driver: local }
  redis_data: { driver: local }
  storage_data: { driver: local }
  logs_data: { driver: local }
  face_database_data: { driver: local }
  ml_artifacts_data: { driver: local }
  chromadb_cache: { driver: local }
  hf_cache_data: { driver: local }
  ollama_models: { driver: local }
  backup_data: { driver: local }
  prometheus_data: { driver: local }
  grafana_data: { driver: local }

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true      # no route off the host: datastores never reach the internet
  ai:
    driver: bridge
  monitoring:
    driver: bridge
    internal: true
  # Shared webhook path with the VMS project (nginx only). External so neither
  # project owns the other's connectivity; provisioned once by deployment
  # preflight: docker network create webhook_integration
  webhook_integration:
    external: true
    name: webhook_integration
