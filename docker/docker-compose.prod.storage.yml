# Optional host storage. deploy.sh includes this only when VAS_DATA_ROOT is set.
# Configure before first deployment; existing volumes require a planned migration.
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${VAS_DATA_ROOT:?set an absolute storage directory}/postgres_data"
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${VAS_DATA_ROOT:?set an absolute storage directory}/redis_data"
