# =============================================================================
# DEVELOPMENT (CPU) — Face Recognition Service
# =============================================================================
# For GPU development, LAYER the override on top of this file:
#   docker compose -f docker/docker-compose.cpu.yml \
#                  -f docker/docker-compose.gpu.yml up -d
#
# Production is a different pair entirely — see docker-compose.prod.yml.
# =============================================================================

# The project name namespaces every volume, network and container. It is NOT
# cosmetic: without it Compose derives the project from this file's parent
# directory — "docker" — and so did docker-compose.prod.yml. Both declare
# volumes named postgres_data, redis_data, face_database_data and
# chromadb_cache, so both resolved to docker_postgres_data &c. and STARTING
# PRODUCTION MOUNTED THIS DEVELOPMENT DATABASE.
#
# Deliberately not plain "face_detector": volumes under that prefix already
# exist on some hosts from an older layout, and adopting them silently would
# resurrect stale data — the same failure in a different costume.
#
# docker-compose.gpu.yml intentionally omits `name:`, so a GPU development run
# inherits this project and therefore the SAME database as a CPU run.
#
# Never set COMPOSE_PROJECT_NAME: it outranks this key.
name: face_detector_dev

services:
  # PostgreSQL Database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg15  # pgvector for vector similarity search
    command:
    - postgres
    - -c
    - max_connections=200
    - -c
    - shared_preload_libraries=pg_stat_statements
    - -c
    - log_statement=mod
    - -c
    - log_duration=on
    - -c
    - log_min_duration_statement=1000
    container_name: face_recognition_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: face_recognition
      POSTGRES_INITDB_ARGS: "-E UTF8"
      POSTGRES_MAX_CONNECTIONS: 200
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
      POSTGRES_WORK_MEM: 16MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d face_recognition"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - face_recognition_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: face_recognition_redis
    command: >
      redis-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - face_recognition_network

  # One-shot schema migration. Both the API and the ML worker wait for this,
  # matching the production startup ordering and eliminating schema races.
  migrate:
    image: face-detector/api:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
      args:
        INSTALL_DEV: "true"
    user: "1000:1000"
    environment:
      ENVIRONMENT: development
      CONFIG_PREFLIGHT: "0"
      MIGRATIONS_MODE: run
      DATABASE_URL: postgresql+asyncpg://postgres:admin@postgres:5432/face_recognition
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: face_recognition
      DB_HOST: postgres
      DB_PORT: "5432"
      HF_HOME: /home/appuser/.cache/huggingface
    volumes:
      - ../:/app
      - hf_cache_data:/home/appuser/.cache/huggingface
    command: ["python", "-m", "backend.utils.migrations", "--upgrade-head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - face_recognition_network

  # Face Recognition Service (CPU Version)
  face_recognition:
    # Name the built image explicitly. Without this, Compose derives it from
    # the project name, so renaming the project silently orphans the existing
    # image and forces a full rebuild — hours, on a slow link, for a change
    # that has nothing to do with the image contents. An explicit tag also
    # means `docker images` shows something meaningful instead of
    # <project>-face_recognition.
    image: face-detector/api:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
      args:
        # This is the DEVELOPMENT stack and the suite runs inside this
        # container, so the image ships its own test runner. Without it, any
        # `docker compose up` that recreates the container loses pytest and the
        # next test run fails for reasons unrelated to the code.
        # Production images leave this at its default of false.
        INSTALL_DEV: "true"
    container_name: face_recognition_api
    user: "1000:1000"
    environment:
      # This is the DEVELOPMENT stack: plain HTTP, permissive config, seeded
      # test credentials. The fail-closed preflight in
      # backend/security/config_guard.py is inert outside production.
      # Production lives in docker-compose.prod.yml.
      ENVIRONMENT: development
      DEBUG: "false"
      # Unbuffered stdout/stderr so every log line reaches `docker logs` immediately
      PYTHONUNBUFFERED: "1"
      HOST: 0.0.0.0
      PORT: 8000
      WORKERS: 1
      USE_GPU: "false"
      ALLOW_CPU_FALLBACK: "true"
      # Docs stay on in development; production disables them.
      ENABLE_API_DOCS: "true"
      # Seeded admin for the integration test suite. Supplied explicitly rather
      # than hardcoded in backend/lifespan.py, and only ever used when no admin
      # account exists yet. Rotation is off so the suite can log in directly.
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: admin123
      BOOTSTRAP_ADMIN_REQUIRE_ROTATION: "false"
      MIGRATIONS_MODE: run
      DATABASE_URL: postgresql+asyncpg://postgres:admin@postgres:5432/face_recognition
      DB_POOL_SIZE: 30
      DB_MAX_OVERFLOW: 60
      DB_POOL_RECYCLE: 3600
      DB_POOL_PRE_PING: "true"
      REDIS_URL: redis://redis:6379/0
      REDIS_MAX_CONNECTIONS: 50
      REDIS_POOL_SIZE: 25
      CACHE_TTL: 3600
      CACHE_LOCAL_SIZE: 20000
      DETECTION_MODEL: /app/weights/det_10g.onnx
      RECOGNITION_MODEL: /app/weights/w600k_r50.onnx
      SIMILARITY_THRESHOLD: 0.4
      CONFIDENCE_THRESHOLD: 0.5
      VECTOR_BACKEND: pgvector
      PGVECTOR_INDEX_TYPE: hnsw
      PGVECTOR_HNSW_M: "32"
      PGVECTOR_HNSW_EF_CONSTRUCTION: "128"
      MAX_QUEUE_SIZE: 2000
      QUEUE_WORKERS: 15
      BATCH_SIZE: 10
      CPU_BATCH_SIZE: 10
      MAX_CONCURRENT_REQUESTS: 150
      DATA_RETENTION_DAYS: 30
      CLEANUP_INTERVAL_HOURS: 24
      BATCH_WRITE_SIZE: 25
      BATCH_WRITE_INTERVAL: "2.0"
      BATCH_WRITE_MAX_WAIT: "5.0"
      FACE_TRACKING_MAX_ENTRIES: 2000
      FACE_TRACKING_MAX_MEMORY_MB: 1000
      FACE_TRACKING_CLEANUP_INTERVAL: 300
      # STORAGE_DIR is the only settable storage root. FACES_DIR,
      # UPLOAD_TEMP_DIR, WEBHOOK_IMAGES_DIR and CROPPED_IMAGES_DIR are
      # derived from it in config.py; setting them here has no effect
      # and config_guard refuses to start on a divergent value.
      STORAGE_DIR: /app/storage
      SAVE_IMAGES: "true"
      MAX_STORAGE_GB: 5000
      MAX_PHOTOS_PER_PERSON: 1
      SAVE_UNKNOWN_FACES: "true"
      SKIP_UNKNOWN_FACES: "false"
      # Debug image dumps OFF in production (they did blocking disk writes per frame)
      SAVE_WEBHOOK_IMAGES: "false"
      SAVE_CROPPED_IMAGES: "false"
      # Inference executor + concurrency caps (event-loop protection)
      INFERENCE_WORKERS: 3
      MAX_CONCURRENT_INFERENCE: 3
      MAX_CONCURRENT_INFERENCE_PER_PIPELINE: 2
      # Webhook fast-path knobs
      WEBHOOK_MAX_BODY_MB: 25
      # 600 covers the VMS worst-case same-event retry horizon (~360s) with margin
      WEBHOOK_DEDUP_TTL_SECONDS: 600
      # Ingest authentication. This is a DEVELOPMENT key, committed on purpose so
      # the enforcement tests exercise a real 401/202 split rather than the
      # no-keys-configured escape hatch. Production supplies its own via
      # WEBHOOK_API_KEYS_FILE and config_guard refuses to start without one.
      WEBHOOK_API_KEYS: "dev-ingest-key-Zr6Xk1Nd8Bq3Ly7Vt5Wc0Mj2Hf9Ps4Ga"
      # Senders present the credential as `Authorization: Bearer <token>` or
      # `X-Webhook-Key: <token>`. WEBHOOK_AUTH_TOKEN is an accepted alias env
      # var that folds into the key set above. `off` is refused in production.
      WEBHOOK_AUTH_MODE: enforce
      # SQL agent isolation
      # Generated SQL executes as a SELECT-only role, never as the
      # application's. The AST guard in sql_agent/security/sql_guard.py
      # is the first layer; this is the one a validator bug cannot defeat.
      SQL_AGENT_DB_USER: fr_readonly
      SQL_AGENT_DB_PASSWORD: ${FR_READONLY_PASSWORD:-TestRo-8jT5nKd3Yc}
      SQL_AGENT_MAX_CONCURRENT: 2
      # Dev runs on NIM (fast); Ollama here is only the emergency
      # fallback. Kept at 300 so a degraded turn fails fast with a
      # clarification instead of hanging the user for minutes — the 7B
      # on CPU needs >120s PER CALL, so the fallback cannot finish a
      # full turn either way. Production tunes its own value.
      SQL_AGENT_TOTAL_TIMEOUT: 300
      # --- Bounded reasoning ------------------------------------------
      # Separate budgets on purpose: a transient DB blip must not spend the
      # turn's ability to think, and a confused model must not spend the
      # budget on look-ups. Dev runs on NIM (fast), so 5 steps is cheap.
      # Must not be SMALLER than the config.py default, which is what a
      # real deployment runs: the prod compose sets no SQL-agent tuning.
      # Dev runs the FASTER model, so dev being the more constrained of
      # the two is backwards - and was, at 5 against a default of 8.
      SQL_AGENT_MAX_REASONING_STEPS: 8
      SQL_AGENT_MAX_REPLANS: 2
      SQL_AGENT_MAX_EXECUTION_RETRIES: 1
      LOG_LEVEL: INFO
      LOG_DIR: /var/log/face-recognition
      # Sentence-transformer / HuggingFace model cache. Declared here so the
      # location is configuration rather than a library default nobody can
      # find. Identical across cpu/gpu/prod; docker-entrypoint.sh creates it,
      # chowns it to appuser, and refuses to start if it is not writable.
      HF_HOME: /home/appuser/.cache/huggingface
      # tqdm progress bars ("Loading weights", "Batches") are terminal UI;
      # in a container they only shred the logs.
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      # Explicit origins, not a wildcard: a wildcard forces credentialed CORS
      # off, and '["*"]' previously parsed as one malformed literal origin.
      CORS_ORIGINS: "http://localhost,http://localhost:8000,http://127.0.0.1,http://127.0.0.1:8000"
      AUTH_ALLOWED_ORIGINS: "http://localhost,http://localhost:8000,http://127.0.0.1,http://127.0.0.1:8000"
      AUTH_SAME_HOST_ORIGIN_TRUSTED: "true"
      OLLAMA_BASE_URL: http://ollama:11434
      # Two-model setup for CPU: small fast model for chat/intent/normalization,
      # Arctic-Text2SQL-R1-7B (Snowflake, 2025) only for SQL generation/repair
      OLLAMA_MODEL: qwen2.5:1.5b
      OLLAMA_SQL_MODEL: hf.co/mradermacher/Arctic-Text2SQL-R1-7B-GGUF:Q4_K_M
      OLLAMA_TEMPERATURE: "0.1"
      # Per-call ceiling sized for the 7B on CPU (a planner-sized prompt
      # measures >120s here). See SQL_AGENT_TOTAL_TIMEOUT above.
      OLLAMA_TIMEOUT: "300"
      # Development-only hosted LLM for the SQL agent (NVIDIA NIM, free tier
      # at build.nvidia.com). Off by default; enable by setting BOTH in
      # docker/.env:
      #   LLM_DEV_PROVIDER=nim
      #   NVIDIA_NIM_API_KEY=nvapi-...
      # Ollama remains the fallback. Production REFUSES this configuration at
      # boot (config guard, exit 78) — do not copy these lines to a prod file.
      LLM_DEV_PROVIDER: ${LLM_DEV_PROVIDER:-}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
      # NVIDIA-BUILT, chosen on measurement rather than branding.
      # Probed against the real system prompt and the real 11 tool specs,
      # 3 runs x 3 decisions, 4s spacing to separate throttling from
      # incapability:
      #   nvidia/nemotron-3.5-lightning-30b-a3b   9/9  0 err  9 native  6.8s
      #   meta/llama-3.2-11b-vision-instruct      9/9  0 err  9 native  2.6s
      #   nvidia/nemotron-3-ultra-550b-a55b       8/9  0 err  9 native  7.9s
      #   nvidia/nemotron-3-super-120b-a12b       4/6  3 err  4 native  5.2s
      #   nvidia/nemotron-3-nano-30b-a3b          0 native tool calls
      # Equal accuracy to the incumbent, ~2.6x the latency per call. Several
      # catalogue models 404 ("Not found for account") — listed is not the
      # same as enabled. Re-run the probe before changing this.
      NVIDIA_NIM_MODEL: ${NVIDIA_NIM_MODEL:-meta/llama-3.2-11b-vision-instruct}
      # openai/gpt-oss-120b stopped responding on this account
      # (2026-08-30: connects and authenticates, then hangs — measured
      # 150s+ with no response, while llama-3.2-11b answers the same
      # prompt in ~1.3s). It was the planner AND SQL model, so every
      # turn burned its whole budget before degrading to the CPU
      # fallback. Re-probe periodically; of the candidates tried
      # (llama-3.3-70b, qwen2.5-coder-32b, llama-3.1-70b, mixtral-8x22b,
      # phi-3.5-mini) only this one is invocable here.
      # NVIDIA-BUILT, chosen on measurement rather than branding.
      # Probed against the real system prompt and the real 11 tool specs,
      # 3 runs x 3 decisions, 4s spacing to separate throttling from
      # incapability:
      #   nvidia/nemotron-3.5-lightning-30b-a3b   9/9  0 err  9 native  6.8s
      #   meta/llama-3.2-11b-vision-instruct      9/9  0 err  9 native  2.6s
      #   nvidia/nemotron-3-ultra-550b-a55b       8/9  0 err  9 native  7.9s
      #   nvidia/nemotron-3-super-120b-a12b       4/6  3 err  4 native  5.2s
      #   nvidia/nemotron-3-nano-30b-a3b          0 native tool calls
      # Equal accuracy to the incumbent, ~2.6x the latency per call. Several
      # catalogue models 404 ("Not found for account") — listed is not the
      # same as enabled. Re-run the probe before changing this.
      NVIDIA_NIM_SQL_MODEL: ${NVIDIA_NIM_SQL_MODEL:-meta/llama-3.2-11b-vision-instruct}
      CHROMADB_PATH: /app/sql_agent/chromadb_data
      CHROMA_COLLECTION_NAME: sql_knowledge_base
      RAG_TOP_K: "5"
      RAG_SIMILARITY_THRESHOLD: "0.3"
      DB_HOST: postgres
      DB_PORT: "5432"
      POSTGRES_DB: face_recognition
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    volumes:
      - ../weights:/app/weights:ro
      - ../assets:/app/assets:ro
      - ../storage:/app/storage  # Unified storage: faces/ for known faces, {pipeline_id}/ for detected faces
      - face_database_data:/app/database
      - chromadb_cache:/home/appuser/.cache/chroma
      # HF_HOME points here (line ~223), but without a volume the
      # sentence-transformers model was re-downloaded from huggingface.co on
      # the first chat after EVERY container recreation — ~90 MB and ~10s of
      # request-path latency, gone each time. Prod already has this volume.
      - hf_cache_data:/home/appuser/.cache/huggingface
      - ../:/app
      - ../logs:/var/log/face-recognition
    # Expose ports internally only (nginx will proxy)
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Liveness only (zero-I/O endpoint): checks the event loop is alive without
      # flapping when a dependency is slow. /health stays available for humans.
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Give gunicorn time to finish in-flight requests + drain the queue on stop
    stop_grace_period: 75s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    networks:
      - face_recognition_network

  # Separate ML worker even in development, so local behavior matches the
  # production request/queue/worker boundary.
  ml_worker:
    image: face-detector/api:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
      args:
        INSTALL_DEV: "true"
    container_name: face_recognition_ml_worker
    user: "1000:1000"
    environment:
      ENVIRONMENT: development
      PYTHONUNBUFFERED: "1"
      CONFIG_PREFLIGHT: "0"
      MIGRATIONS_MODE: verify
      DATABASE_URL: postgresql+asyncpg://postgres:admin@postgres:5432/face_recognition
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: face_recognition
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 5
      DB_POOL_PRE_PING: "true"
      ML_WORKER_ID: ml-worker-development-primary
      ML_ARTIFACT_DIR: /app/models/ml
      LOG_LEVEL: INFO
      LOG_DIR: /var/log/face-recognition
      HF_HOME: /home/appuser/.cache/huggingface
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    volumes:
      - ../:/app
      - ../logs:/var/log/face-recognition
      - hf_cache_data:/home/appuser/.cache/huggingface
    command: ["python", "-m", "backend.ml.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - face_recognition_network

  # Ollama Service (CPU)
  ollama:
    image: ollama/ollama:latest
    container_name: face_recognition_ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODELS=/root/.ollama/models
      # Keep models loaded in RAM permanently - avoids cold-start reload lag on CPU
      - OLLAMA_KEEP_ALIVE=-1
      # Verbose logging: model load/unload, prompt tokenization, per-request timing,
      # generation progress - use `docker logs -f face_recognition_ollama` to debug.
      - OLLAMA_DEBUG=1
      # Log every HTTP request/response (GIN framework) with status and latency
      - GIN_MODE=debug
    volumes:
      # A named volume, not a host path. This used to be
      # "C:/Users/Raven/.ollama:/root/.ollama" — one developer's home
      # directory, hardcoded, which made the repository unusable on any other
      # machine and silently produced an Ollama with no models elsewhere.
      #
      # Point OLLAMA_MODELS_PATH (docker/.env) at an existing host model
      # directory to reuse already-downloaded models — worth doing on an
      # air-gapped host. Otherwise models live in the named volume and are
      # pulled once.
      - ${OLLAMA_MODELS_PATH:-ollama_models}:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - face_recognition_network

  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  # Martin — offline tile server for the MapLibre maps.
  #
  # Serves the prepared Lebanon datasets in ./map-data/production (mounted
  # read-only; data lives outside image layers and survives down/up
  # --force-recreate). Reachable ONLY through nginx at /maps/ — no host port,
  # so the browser never sees martin:3000. Configuration is explicit
  # (config/martin.yaml, validated against this exact image tag); nothing is
  # auto-detected and nothing is downloaded at start-up.
  #
  # Air-gapped hosts: `docker save ghcr.io/maplibre/martin:1.13.0 -o martin.tar`
  # on the connected machine, `docker load -i martin.tar` on the target.
  # ---------------------------------------------------------------------------
  martin:
    image: ghcr.io/maplibre/martin:1.13.0
    container_name: face_recognition_martin
    command: ["--config", "/config/martin.yaml"]
    volumes:
      - ../map-data:/map-data:ro
      - ../config/martin.yaml:/config/martin.yaml:ro
    # A REAL readiness probe: Martin's /health only answers once the config is
    # parsed and every configured source has been opened. wget is present in
    # the image; curl is not.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - face_recognition_network

  nginx:
    image: nginx:alpine
    container_name: face_recognition_nginx
    volumes:
      - ../nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend:/usr/share/nginx/html/frontend:ro
      - ../icons:/usr/share/nginx/html/icons:ro
      # Offline Lebanon basemap (~1 GB, excluded from images by .dockerignore
      # on purpose) — read-only bind, one copy on disk, served by nginx.
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      face_recognition:
        condition: service_healthy
      # /maps/ is proxied to Martin; do not accept traffic before it can
      # serve tiles, or the first map view is a wall of 502s.
      martin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
    networks:
      face_recognition_network:
      # Webhook ingress from the VMS project (separate compose project, separate
      # private network). ONLY nginx joins; the API/db/redis stay private and the
      # existing /webhook/ location proxies onward to face_recognition:8000.
      webhook_integration:
        aliases:
          - face-webhook

  # ===========================================================================
  # Optional dev observability — OFF by default. Start with:
  #     docker compose -f docker/docker-compose.cpu.yml --profile monitoring up -d
  # Reuses the same monitoring/ configs as production, so a dashboard or alert
  # edited here is exactly what prod runs. The prometheus.yml target
  # `face_recognition:8000` resolves on this compose network too.
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: face_recognition_prometheus
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus_dev_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # loopback only — dev inspection, not exposed
    restart: unless-stopped
    networks:
      - face_recognition_network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: face_recognition_grafana
    profiles: ["monitoring"]
    environment:
      # Dev-only default; override with GRAFANA_ADMIN_PASSWORD in .env.
      # (Production compose REQUIRES the variable and has no default.)
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-face-detector-dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_dev_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"   # loopback only
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - face_recognition_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  face_database_data:
    driver: local
  chromadb_cache:
    driver: local
  # sentence-transformers / HF Hub cache (HF_HOME). One ~90 MB download that
  # must outlive container recreation — see the mount on the api service.
  hf_cache_data:
    driver: local
  prometheus_dev_data:
    driver: local
  grafana_dev_data:
    driver: local
  # Ollama models. Declared even though OLLAMA_MODELS_PATH can substitute a
  # host path for it: an unused volume declaration costs nothing, whereas a
  # missing one breaks the default (and default is the case everyone hits
  # first on a fresh clone).
  ollama_models:
    driver: local

networks:
  face_recognition_network:
    driver: bridge
  # Shared webhook path with the VMS project. External so neither project owns
  # (or can tear down) the other's connectivity; provisioned once:
  #   docker network create webhook_integration
  webhook_integration:
    external: true
    name: webhook_integration
