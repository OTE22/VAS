services:
  # PostgreSQL Database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg15  # pgvector for vector similarity search
    command:
    - postgres
    - -c
    - max_connections=200
    - -c
    - shared_preload_libraries=pg_stat_statements
    - -c
    - log_statement=mod
    - -c
    - log_duration=on
    - -c
    - log_min_duration_statement=1000
    container_name: face_recognition_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: face_recognition
      POSTGRES_INITDB_ARGS: "-E UTF8"
      POSTGRES_MAX_CONNECTIONS: 200
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
      POSTGRES_WORK_MEM: 16MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d face_recognition"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - face_recognition_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: face_recognition_redis
    command: >
      redis-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - face_recognition_network

  # Face Recognition Service (CPU Version)
  face_recognition:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
    container_name: face_recognition_api
    user: "1000:1000"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      # Unbuffered stdout/stderr so every log line reaches `docker logs` immediately
      PYTHONUNBUFFERED: "1"
      HOST: 0.0.0.0
      PORT: 8000
      WORKERS: 1
      USE_GPU: "false"
      DATABASE_URL: postgresql+asyncpg://postgres:admin@postgres:5432/face_recognition
      DB_POOL_SIZE: 30
      DB_MAX_OVERFLOW: 60
      DB_POOL_RECYCLE: 3600
      DB_POOL_PRE_PING: "true"
      REDIS_URL: redis://redis:6379/0
      REDIS_MAX_CONNECTIONS: 50
      REDIS_POOL_SIZE: 25
      CACHE_TTL: 3600
      CACHE_LOCAL_SIZE: 20000
      DETECTION_MODEL: /app/weights/det_10g.onnx
      RECOGNITION_MODEL: /app/weights/w600k_r50.onnx
      SIMILARITY_THRESHOLD: 0.4
      CONFIDENCE_THRESHOLD: 0.5
      FACES_DIR: /app/storage/faces
      DB_PATH: /app/database/face_database
      VECTOR_BACKEND: pgvector
      PGVECTOR_INDEX_TYPE: hnsw
      PGVECTOR_HNSW_M: "32"
      PGVECTOR_HNSW_EF_CONSTRUCTION: "128"
      MAX_QUEUE_SIZE: 2000
      QUEUE_WORKERS: 15
      BATCH_SIZE: 10
      CPU_BATCH_SIZE: 10
      MAX_CONCURRENT_REQUESTS: 150
      DATA_RETENTION_DAYS: 30
      CLEANUP_INTERVAL_HOURS: 24
      BATCH_WRITE_SIZE: 25
      BATCH_WRITE_INTERVAL: "2.0"
      BATCH_WRITE_MAX_WAIT: "5.0"
      FACE_TRACKING_MAX_ENTRIES: 2000
      FACE_TRACKING_MAX_MEMORY_MB: 1000
      FACE_TRACKING_CLEANUP_INTERVAL: 300
      STORAGE_DIR: /app/storage
      SAVE_IMAGES: "true"
      MAX_STORAGE_GB: 5000
      MAX_PHOTOS_PER_PERSON: 1
      SAVE_UNKNOWN_FACES: "true"
      SKIP_UNKNOWN_FACES: "false"
      # Debug image dumps OFF in production (they did blocking disk writes per frame)
      SAVE_WEBHOOK_IMAGES: "false"
      SAVE_CROPPED_IMAGES: "false"
      # Inference executor + concurrency caps (event-loop protection)
      INFERENCE_WORKERS: 3
      MAX_CONCURRENT_INFERENCE: 3
      MAX_CONCURRENT_INFERENCE_PER_PIPELINE: 2
      # Webhook fast-path knobs
      WEBHOOK_MAX_BODY_MB: 25
      WEBHOOK_DEDUP_TTL_SECONDS: 60
      # SQL agent isolation
      SQL_AGENT_MAX_CONCURRENT: 2
      SQL_AGENT_TOTAL_TIMEOUT: 300
      ENABLE_METRICS: "true"
      METRICS_PORT: 9090
      LOG_LEVEL: INFO
      LOG_DIR: /var/log/face-recognition
      CORS_ORIGINS: '["*"]'
      OLLAMA_BASE_URL: http://ollama:11434
      # Two-model setup for CPU: small fast model for chat/intent/normalization,
      # Arctic-Text2SQL-R1-7B (Snowflake, 2025) only for SQL generation/repair
      OLLAMA_MODEL: qwen2.5:1.5b
      OLLAMA_SQL_MODEL: hf.co/mradermacher/Arctic-Text2SQL-R1-7B-GGUF:Q4_K_M
      OLLAMA_TEMPERATURE: "0.1"
      OLLAMA_TIMEOUT: "120"
      CHROMADB_PATH: /app/sql_agent/chromadb_data
      CHROMA_COLLECTION_NAME: sql_knowledge_base
      RAG_TOP_K: "5"
      RAG_SIMILARITY_THRESHOLD: "0.3"
      DB_HOST: postgres
      DB_PORT: "5432"
      POSTGRES_DB: face_recognition
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    volumes:
      - ../weights:/app/weights:ro
      - ../assets:/app/assets:ro
      - ../storage:/app/storage  # Unified storage: faces/ for known faces, {pipeline_id}/ for detected faces
      - face_database_data:/app/database
      - chromadb_data:/app/chromadb_data
      - chromadb_cache:/home/appuser/.cache/chroma
      - ../:/app
      - ../logs:/var/log/face-recognition
    # Expose ports internally only (nginx will proxy)
    expose:
      - "8000"
      - "9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Liveness only (zero-I/O endpoint): checks the event loop is alive without
      # flapping when a dependency is slow. /health stays available for humans.
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Give gunicorn time to finish in-flight requests + drain the queue on stop
    stop_grace_period: 75s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    networks:
      - face_recognition_network

  # Ollama Service (CPU)
  ollama:
    image: ollama/ollama:latest
    container_name: face_recognition_ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODELS=/root/.ollama/models
      # Keep models loaded in RAM permanently - avoids cold-start reload lag on CPU
      - OLLAMA_KEEP_ALIVE=-1
      # Verbose logging: model load/unload, prompt tokenization, per-request timing,
      # generation progress - use `docker logs -f face_recognition_ollama` to debug.
      - OLLAMA_DEBUG=1
      # Log every HTTP request/response (GIN framework) with status and latency
      - GIN_MODE=debug
    volumes:
      # Use host directory for Ollama models (Windows path - must use quotes and double backslashes)
      - "C:/Users/Raven/.ollama:/root/.ollama"
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - face_recognition_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: face_recognition_nginx
    volumes:
      - ../nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend:/usr/share/nginx/html/frontend:ro
      - ../icons:/usr/share/nginx/html/icons:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      face_recognition:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - face_recognition_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  face_database_data:
    driver: local
  chromadb_data:
    driver: local
  chromadb_cache:
    driver: local
  # ollama_data volume removed - using host directory C:\Users\Raven\.ollama instead

networks:
  face_recognition_network:
    driver: bridge

