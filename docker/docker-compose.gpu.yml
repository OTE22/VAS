# =============================================================================
# DEVELOPMENT GPU — an OVERRIDE, not a stack. Layer it on the CPU stack:
#
#   docker compose -f docker/docker-compose.cpu.yml \
#                  -f docker/docker-compose.gpu.yml up -d
#
# Running this file alone does nothing useful: it declares no postgres, no
# redis, no nginx. That is the point — everything except the GPU delta is
# inherited, so a change to the dev stack cannot be forgotten here.
#
# PRODUCTION GPU IS A DIFFERENT PAIR:
#   docker compose -f docker/docker-compose.prod.yml \
#                  -f docker/docker-compose.prod.gpu.yml up -d
#
# ---------------------------------------------------------------------------
# This file used to be a 442-line standalone stack with ENVIRONMENT=production,
# file-based secrets and a migrate job — a THIRD production stack that was
# missing the backup service, Prometheus, Grafana and the segmented networks
# that docker-compose.prod.yml has. Every document called it "the development
# GPU stack", which it was not, and it could not start anyway: it required
# POSTGRES_SUPERUSER_PASSWORD and secrets/jwt_secret. So there was no working
# GPU development path at all. This is that path.
#
# No top-level `name:` — the project is inherited from cpu.yml
# (face_detector_dev), so switching between CPU and GPU development keeps the
# SAME database. Adding a name here would silently fork your data.
#
# Merge semantics that make this correct:
#   * `environment` is a map: merged key-by-key, this file wins.
#   * `build.context` is inherited; only `dockerfile` is replaced.
#   * `deploy.resources.reservations.devices` is a LIST and APPENDS — never
#     add a devices entry to cpu.yml or GPUs get reserved twice.
#   * `volumes` merge by target path, so cpu.yml's ollama mount is reused.
#   * ollama's `environment` is LIST form in cpu.yml; it must stay list form
#     here or the two do not merge.
# =============================================================================

services:
  face_recognition:
    build:
      dockerfile: docker/Dockerfile.gpu
    # Same explicit image name as the CPU stack would produce is NOT wanted:
    # the GPU image has different contents (CUDA runtime, onnxruntime-gpu), so
    # it gets its own tag. Otherwise a GPU build would overwrite the CPU image.
    image: face-detector/api:dev-gpu
    environment:
      USE_GPU: "true"
      # Fail loudly rather than fall back. On a machine with a GPU, silently
      # running on CPU is the worst outcome: results stay correct while
      # throughput collapses, and every health check stays green. The startup
      # gate in backend/core/gpu_runtime.py raises GpuUnavailableError instead.
      ALLOW_CPU_FALLBACK: "false"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # A GPU absorbs far more in-flight work than the CPU defaults allow.
      MAX_QUEUE_SIZE: 10000
      QUEUE_WORKERS: 50
      MAX_CONCURRENT_REQUESTS: 500
      BATCH_SIZE: 20
      GPU_BATCH_SIZE: 32
      PIPELINE_BATCH_SIZE: 5
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 16G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ml_worker:
    build:
      dockerfile: docker/Dockerfile.gpu
    image: face-detector/api:dev-gpu
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama:
    # List form, matching cpu.yml. Do not switch to map form here.
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
