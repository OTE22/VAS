# Optional independent workspace: never joins the API/database networks.
# See Docs/ml-dataset-debugging.md for startup and SSH access.
name: face_detector_notebook
services:
  notebook:
    build:
      context: ./notebook
      dockerfile: Dockerfile
    image: vas-dataset-notebook:local
    init: true
    user: "1000:1000"
    read_only: true
    environment:
      JUPYTER_TOKEN_FILE: /run/secrets/notebook_token
    secrets:
      - notebook_token
    volumes:
      - ml_artifacts:/artifacts:ro
      - notebook_workspace:/workspace
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/notebook/.local:size=64m,uid=1000,gid=1000
      - /home/notebook/.cache:size=64m,uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.0
    networks: [notebook_only]
    restart: "no"
  notebook_proxy:
    image: nginx:alpine
    entrypoint: ["nginx", "-g", "daemon off;"]
    user: "101:101"
    read_only: true
    ports:
      - "127.0.0.1:${NOTEBOOK_PORT:-8888}:8080"
    volumes:
      - ./notebook/proxy.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 64m
    depends_on: [notebook]
    networks: [notebook_only, notebook_access]
    restart: unless-stopped
networks:
  notebook_only:
    internal: true
  notebook_access:
volumes:
  ml_artifacts:
    external: true
    name: ${NOTEBOOK_ARTIFACT_VOLUME:-face_detector_prod_ml_artifacts_data}
  notebook_workspace:
secrets:
  notebook_token:
    file: ${NOTEBOOK_TOKEN_FILE:?Set NOTEBOOK_TOKEN_FILE to a protected notebook token file}
