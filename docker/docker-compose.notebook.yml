# Notebook kernels remain isolated; only the admin gateway joins the API edge.
# See Docs/ml-dataset-debugging.md for startup and VAS admin access.
name: face_detector_notebook
services:
  notebook:
    build:
      context: ./notebook
      dockerfile: Dockerfile
    image: vas-dataset-notebook:local
    init: true
    user: "1000:1000"
    read_only: true
    environment:
      JUPYTER_TOKEN_FILE: /run/secrets/notebook_token
    secrets:
      - notebook_token
    volumes:
      - ml_artifacts:/artifacts:ro
      - notebook_workspace:/workspace
      - notebook_auth_state:/auth-state
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/notebook/.local:size=64m,uid=1000,gid=1000
      - /home/notebook/.cache:size=64m,uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.0
    networks: [notebook_only]
    restart: unless-stopped
  notebook_proxy:
    image: vas-dataset-notebook:local
    entrypoint: ["python", "/opt/notebook/gateway.py"]
    user: "1000:1000"
    read_only: true
    environment:
      JUPYTER_TOKEN_FILE: /run/secrets/notebook_token
      VAS_AUTH_URL: http://face_recognition:8000/api/ml/notebook-access
    secrets: [notebook_token]
    volumes:
      - ./notebook/gateway.py:/opt/notebook/gateway.py:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    depends_on: [notebook]
    networks:
      notebook_only:
      production_edge:
        aliases: [vas-notebook-gateway]
    restart: unless-stopped
networks:
  notebook_only:
    internal: true
  production_edge:
    external: true
    name: face_detector_prod_edge
volumes:
  ml_artifacts:
    external: true
    name: ${NOTEBOOK_ARTIFACT_VOLUME:-face_detector_prod_ml_artifacts_data}
  notebook_workspace:
  notebook_auth_state:
secrets:
  notebook_token:
    file: ${NOTEBOOK_TOKEN_FILE:?Set NOTEBOOK_TOKEN_FILE to a protected notebook token file}
