# /etc/nginx/nginx.conf  —  PRODUCTION (TLS)
# =============================================================================
# Generated from nginx.conf, which stays plain-HTTP for the development stack.
# Mounted by docker/docker-compose.prod.yml and docker-compose.gpu.yml.
#
# Requires certs/ to contain server.crt and server.key:
#     bash scripts/tls/make-internal-ca.sh face-detector.internal <lan-ip>
#
# HSTS is COMMENTED OUT below on purpose. Enabling it before every client trusts
# certs/internal-ca.crt makes browsers refuse the HTTP fallback with no
# in-browser override, locking users out. Turn it on only after verifying:
#     curl --cacert certs/internal-ca.crt -I https://face-detector.internal/
# =============================================================================
# IMPORTANT: in Docker Compose, upstream MUST use the *service name* (not container_name).
# In your compose, service name is: face_recognition  (container_name is face_recognition_api)
# So upstream should be: face_recognition:8000

user  nginx;
worker_processes auto;
pid /var/run/nginx.pid;

# stdout/stderr so Docker's json-file driver rotates them. The previous
# file paths were inside the container and were never collected.
error_log  /dev/stderr warn;

events {
  worker_connections  8192;
  multi_accept on;
  use epoll;  # ignored on non-Linux, fine
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ES-module MIME type. The stock mime.types has no `mjs` entry, so the
  # vendored MapLibre modules (frontend/vendor/maplibre/*.mjs) would be
  # served as application/octet-stream and `<script type="module">` would
  # refuse them. This MUST live here at http level: a `types` block inside
  # server{} REPLACES the inherited map rather than extending it (verified
  # live — a server-level block turned every .css into octet-stream). At
  # http level, after the include, it is the same context as mime.types
  # and simply adds the extension.
  types {
    application/javascript  mjs;
  }

  server_tokens off;

  # Logging
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time uct=$upstream_connect_time '
                  'uht=$upstream_header_time urt=$upstream_response_time';

  access_log /dev/stdout main;

  # Performance
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  keepalive_timeout 65;
  keepalive_requests 1000;

  # NOT arbitrary: this is the batch-search worst case, and it is the only
  # request shape that legitimately needs it —
  #     BATCH_SEARCH_MAX_IMAGES (20) x MAX_FILE_SIZE (10MB) = 200M
  # Both are settings in config.py. If either changes, change this with it:
  # too low silently truncates a full batch at the proxy (the client sees 413
  # with no application log line at all), too high lets nginx buffer that much
  # per connection on endpoints whose handler rejects at 10MB anyway.
  # tests/test_deployment_surface.py asserts the three stay consistent.
  # Ingest has a tighter limit of its own; see the webhook location below.
  client_max_body_size 200M;
  client_body_buffer_size 512k;

  # Timeouts (production-friendly for inference)
  client_body_timeout 60s;
  client_header_timeout 60s;
  send_timeout 60s;

  # Buffers (tune for large headers if needed)
  client_header_buffer_size 8k;
  large_client_header_buffers 4 32k;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/xml
    application/xml+rss application/rss+xml
    image/svg+xml;

  # Docker internal DNS resolver (helps avoid "host not found" on startup)
  # This makes NGINX re-resolve service names dynamically.
  resolver 127.0.0.11 ipv6=off valid=10s;
  resolver_timeout 5s;

  # Upstream to your FastAPI service
  upstream face_recognition_backend {
    least_conn;

    # Use service name "face_recognition" (from compose), not container_name.
    # "resolve" ensures DNS refresh if container IP changes.
    # `resolve` is NGINX Plus only and is rejected by nginx:alpine.
    server face_recognition:8000 max_fails=3 fail_timeout=10s;

    keepalive 128;
  }

  # Map for websocket connection header
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Rate limiting zones (optional, but production-safe)
  # Adjust rate to your usage.
  limit_req_zone $binary_remote_addr zone=api_rate:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  # Authentication endpoints get their own, far stricter budget: credential
  # submission is never a high-rate operation, and this is the outermost
  # layer of brute-force defence (the API also enforces per-account and
  # per-IP throttling in Redis, which survives nginx reloads).
  limit_req_zone $binary_remote_addr zone=auth_rate:10m rate=10r/m;

  # Real client IP.
  #
  # nginx IS the edge proxy here — there is nothing in front of it. Trusting
  # X-Forwarded-For from RFC1918 ranges therefore trusted it from every LAN
  # client, so a client could send `X-Forwarded-For: 10.0.0.1` and choose the
  # address used for rate limiting, the /metrics allowlist and audit logs.
  # That defeats the 10r/m login brute-force limit outright: rotate the header,
  # get a fresh bucket every request.
  #
  # Only enable the two directives below if a load balancer is genuinely
  # deployed in front of nginx, and then list ONLY that balancer's address.
  # real_ip_header X-Forwarded-For;
  # set_real_ip_from <load-balancer-ip>/32;

  # ---------------------------------------------------------------------------
  # Plain HTTP: redirect everything to HTTPS.
  # ACME/health probes are not exempted — this deployment uses an internal CA.
  # ---------------------------------------------------------------------------
  server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 308 preserves the method and body, so a redirected POST is not silently
    # downgraded to GET the way a 301/302 would be.
    return 308 https://$host$request_uri;
  }

  # ---------------------------------------------------------------------------
  # HTTPS
  # ---------------------------------------------------------------------------
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;

    # --- TLS -----------------------------------------------------------------
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # TLS 1.2 is retained for older LAN clients; 1.0/1.1 are not offered.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;   # TLS 1.3 cipher choice belongs to the client
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;   # forward secrecy: no reusable ticket keys

    # OCSP stapling is intentionally OFF: an internal CA publishes no OCSP
    # responder, so enabling it only adds failed lookups and startup warnings.
    # ssl_stapling on;

    # HSTS — enable ONLY after every client trusts certs/internal-ca.crt.
    # No includeSubDomains/preload: the internal domain layout is not known here.
    # add_header Strict-Transport-Security "max-age=86400" always;

    # Security headers. NOTE: nginx `add_header` does not merge across levels —
    # any location block that sets its own add_header drops every one of these,
    # so security-relevant locations repeat them.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # script-src has no 'unsafe-inline': the frontend has no inline <script>
    # and no inline event handlers. style-src does allow it — a handful of
    # style="" attributes remain, and inline CSS is not a script-execution
    # vector. frame-src covers the sandboxed srcdoc iframes used for maps.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self'; frame-src 'self' blob: data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Health endpoints (fast pass-through; Connection "" keeps upstream keepalive)
    location = /health/live {
      proxy_pass http://face_recognition_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
      access_log off;
    }

    location = /health/ready {
      proxy_pass http://face_recognition_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 15s;
      access_log off;
    }

    location = /health {
      proxy_pass http://face_recognition_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      access_log off;
    }

    # WebSocket endpoints - handle both /ws and /ws/
    location /ws {
      # Optional: limit per IP
      limit_conn conn_limit 50;

      proxy_pass http://face_recognition_backend;
      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Prevent caching of WebSocket connections
      proxy_cache_bypass $http_upgrade;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Metrics: internal scrapers only. Exposes request volumes, authentication
    # failure counts and internal timings, so it is never public.
    location /metrics {
      # Docker bridge networks only. 10/8 and 192.168/16 are deliberately NOT
      # listed: those are the LAN client ranges this is meant to exclude.
      # Prometheus scrapes the API container directly on the monitoring
      # network, so it does not depend on this path at all.
      allow 127.0.0.1;
      allow 172.16.0.0/12;
      deny all;

      proxy_pass http://face_recognition_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      access_log off;
    }

    # Static files - served directly by nginx for performance
    # CRITICAL: must come BEFORE the catch-all location block.
    # ^~ prefix match covers EVERYTHING under /frontend/ (css, js, vendor,
    # components, fonts, webfonts, html) so no static asset ever reaches Python.
    location ^~ /frontend/ {
      root /usr/share/nginx/html;
      try_files $uri =404;
      charset utf-8;
      expires 1y;
      add_header Cache-Control "public, immutable";
      add_header Access-Control-Allow-Origin *;
      add_header X-Content-Type-Options nosniff;
      access_log off;
    }

    # Icons directory - use ^~ for priority prefix matching
    location ^~ /icons/ {
      root /usr/share/nginx/html;
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log on;
    }

    # Favicon
    location = /favicon.ico {
      root /usr/share/nginx/html;
      try_files /icons/favicon.ico =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    # Authentication endpoints — strict rate limit, never cached.
    # MUST come before the general /api location so it matches first.
    location ~ ^/api/auth/(login|logout)$ {
      # 10 requests/minute per source, small burst for legitimate retries.
      # nodelay so the 11th attempt is rejected immediately rather than queued.
      limit_req zone=auth_rate burst=5 nodelay;
      limit_req_status 429;
      limit_conn conn_limit 20;

      # Credentials must never be written to any cache, proxy or browser store
      proxy_no_cache 1;
      proxy_cache_bypass 1;
      add_header Cache-Control "no-store" always;
      add_header Pragma "no-cache" always;

      # Cap the request body: credentials are tiny, so anything larger is abuse
      client_max_body_size 16k;

      proxy_pass http://face_recognition_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Forward Origin/Referer so the API can enforce login-CSRF checks
      proxy_set_header Origin $http_origin;
      proxy_set_header Referer $http_referer;
      proxy_set_header Authorization $http_authorization;

      # bcrypt verification is intentionally slow; allow for it but no longer
      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    # SSE Streaming endpoint - MUST disable buffering for real-time streaming
    # This MUST come BEFORE the general API location block to match first
    location ~ ^/api/sql-agent/query/stream$ {
      # Adjusted rate limiting for AI inference (long requests)
      limit_req zone=api_rate burst=120 delay=20;
      limit_conn conn_limit 200;

      proxy_pass http://face_recognition_backend;
      proxy_http_version 1.1;

      # CRITICAL: Disable connection close by proxy for SSE
      # Empty Connection header prevents Nginx from adding "Connection: close"
      proxy_set_header Connection "";

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;

      # CRITICAL: Disable buffering for SSE streaming
      proxy_buffering off;
      proxy_cache off;
      proxy_request_buffering off;

      # Extended timeouts for long-running streams (1 hour for very long queries)
      proxy_connect_timeout 30s;
      proxy_send_timeout 3600s;  # 1 hour for streaming
      proxy_read_timeout 3600s;  # 1 hour for streaming
      send_timeout 3600s;        # 1 hour timeout

      # Disable gzip for SSE (breaks streaming - gzip buffers data)
      gzip off;
    }

    # Webhook ingestion - dedicated location: bounded body size, short timeouts
    # (the handler now answers 202 in milliseconds), buffering on.
    location ~ ^/(api/)?webhook/ {
      limit_req zone=api_rate burst=120 delay=20;
      limit_conn conn_limit 200;

      # Must equal WEBHOOK_MAX_BODY_MB (config.py). The handler rejects a
      # larger body itself, but only after reading it; matching here means
      # an oversized frame is refused at the edge instead of occupying a
      # worker. Asserted by tests/test_deployment_surface.py.
      client_max_body_size 25m;

      proxy_pass http://face_recognition_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;

      proxy_connect_timeout 10s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;

      proxy_buffering on;
      proxy_request_buffering on;
    }

    # /redoc (offline bundle, backend/main.py): Redoc's search index runs in a
    # Web Worker created from a blob: URL — same-origin script, not an external
    # host. Only this location widens worker-src to blob:; every other header is
    # repeated because add_header does not inherit. Redoc's external
    # "logo-mini.svg" stays blocked by img-src (no external hosts, by design).
    location = /redoc {
      limit_req zone=api_rate burst=120 delay=20;
      limit_conn conn_limit 200;

      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-src 'self' blob: data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

      proxy_pass http://face_recognition_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_buffering on;
      proxy_buffer_size 16k;
      proxy_buffers 32 16k;
      proxy_busy_buffers_size 64k;
    }

    # Martin tile server (offline basemaps: vector streets, DEM, satellite).
    location ^~ /maps/ {
      # A VARIABLE upstream, deliberately: with a literal `http://martin:3000/`
      # nginx resolves the name at config load and refuses to start (or
      # reload) whenever Martin is not yet up — `host not found in upstream`.
      # A variable defers resolution to request time through the Docker
      # resolver declared in the http block, so a down tile server costs a
      # 502 on /maps/ instead of taking the whole site with it. The rewrite
      # strips the /maps/ prefix, which a variable proxy_pass does not do
      # for us the way a trailing-slash literal would.
      set $martin_upstream http://martin:3000;
      rewrite ^/maps/(.*)$ /$1 break;
      proxy_pass $martin_upstream;
      # Martin builds TileJSON URLs from this header, so /maps/<id> reports
      # tiles under the public /maps/ prefix instead of the stripped path.
      proxy_set_header X-Rewrite-URL $request_uri;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
      proxy_buffering on;
      # add_header drops inherited server-level headers, so the security set
      # is repeated. No CORS: same origin by construction. Tiles are public
      # basemap bytes, not personal data — cacheable.
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Cache-Control "public, max-age=86400" always;
      access_log off;
    }

    # API routes - proxy to FastAPI backend
    location ~ ^/(api|docs|redoc|openapi\.json) {
      # Adjusted rate limiting for AI inference (long requests)
      limit_req zone=api_rate burst=120 delay=20;
      limit_conn conn_limit 200;

      proxy_pass http://face_recognition_backend;
      proxy_http_version 1.1;

      # Keep upstream connections alive (the upgrade map lives ONLY in /ws;
      # "Connection: upgrade/close" here defeated the keepalive pool entirely)
      proxy_set_header Connection "";

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;

      # Timeouts (inference may take time - CPU LLM queries can run several minutes;
      # must be >= gunicorn timeout of 600s so nginx doesn't cut off in-flight requests)
      proxy_connect_timeout 30s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;

      # Buffers
      proxy_buffering on;
      proxy_buffer_size 16k;
      proxy_buffers 32 16k;
      proxy_busy_buffers_size 64k;

      # Helps with big uploads
      proxy_request_buffering on;
    }

    # Default: proxy everything else to FastAPI (for backward compatibility)
    location / {
      # Adjusted rate limiting for AI inference (long requests)
      limit_req zone=api_rate burst=120 delay=20;
      limit_conn conn_limit 200;

      proxy_pass http://face_recognition_backend;
      proxy_http_version 1.1;

      # Plain HTTP pages - keep upstream keepalive (no upgrade header here)
      proxy_set_header Connection "";

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;

      proxy_connect_timeout 30s;
      proxy_send_timeout 180s;
      proxy_read_timeout 180s;

      proxy_buffering on;
      proxy_buffer_size 16k;
      proxy_buffers 32 16k;
      proxy_busy_buffers_size 64k;
      proxy_request_buffering on;
    }
  }
}
