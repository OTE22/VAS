apiVersion: 1

datasources:
  - name: Prometheus
    # A STABLE uid, so a dashboard exported from the UI (which bakes the uid
    # in) still resolves on a freshly provisioned volume. Without this Grafana
    # generates a random uid per install and exported dashboards break.
    uid: prometheus
    type: prometheus
    access: proxy
    # Compose service name on the internal monitoring network.
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
