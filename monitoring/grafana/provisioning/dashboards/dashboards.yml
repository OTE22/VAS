apiVersion: 1

providers:
  - name: face-detector
    orgId: 1
    folder: Face Detector
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    # The dashboards directory is bind-mounted READ-ONLY; offering "Save" in
    # the UI against a read-only file only produces a confusing error. Edit
    # the JSON in the repo instead — it re-provisions within 30s.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
