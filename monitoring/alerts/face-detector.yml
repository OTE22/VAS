groups:
  # ==========================================================================
  # Availability
  # ==========================================================================
  - name: availability
    rules:
      - alert: APIDown
        expr: up{job="face_recognition_api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Face recognition API is not responding to scrapes"
          description: >-
            Prometheus has been unable to scrape the API for 2 minutes. Check
            `docker compose logs face_recognition`. If the container is exiting
            with code 78 the configuration preflight is rejecting the config —
            the reason is printed on stderr.

      # NOTE: a PrometheusTargetMissing alert using absent(up{...}) used to
      # live here. With a static_configs target the series only disappears if
      # the scrape config itself is edited — a stopped container is `up == 0`,
      # which APIDown above already pages on. The absent() form was inert.

  # ==========================================================================
  # Errors and latency
  # ==========================================================================
  - name: errors
    rules:
      # Built on the HTTP middleware histogram, whose `status` label is the
      # numeric HTTP code. The previous version filtered
      # face_recognition_requests_total{status=~"5.."} — but that counter's
      # `status` holds webhook outcome words (queued/duplicate/queue_full/...),
      # never an HTTP code, so the numerator was empty and the alert could not
      # fire under any circumstances.
      - alert: High5xxRate
        expr: |
          sum(rate(face_recognition_request_duration_seconds_count{status=~"5.."}[5m]))
            / clamp_min(sum(rate(face_recognition_request_duration_seconds_count[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Over 5% of HTTP requests are returning 5xx"
          description: "{{ $value | humanizePercentage }} of requests are failing."

      - alert: WebhookQueueRejections
        # The ingest-specific failure the generic 5xx alert cannot see: the
        # webhook answers 503 queue_full when the processing queue is at
        # capacity, counted on the webhook outcome counter.
        expr: |
          sum(rate(face_recognition_requests_total{status="queue_full"}[5m]))
            / clamp_min(sum(rate(face_recognition_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Ingest is rejecting frames (queue full)"
          description: >-
            More than 5% of webhook frames are being refused with 503.
            Cameras are sending faster than inference can drain the queue.

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(face_recognition_request_duration_seconds_bucket[5m])) by (le)) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 request latency above 5s"
          description: "p95 is {{ $value | humanizeDuration }}."

  # ==========================================================================
  # Authentication
  # ==========================================================================
  - name: authentication
    rules:
      - alert: AuthenticationFailureSpike
        expr: sum(rate(auth_login_failures_total[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sustained login failures — possible credential stuffing"
          description: >-
            {{ $value | printf "%.2f" }} failed logins/sec over 5 minutes. The
            API throttles per account, per IP and globally; this alert means the
            attempts are ongoing, not that they are succeeding.

      - alert: LoginRateLimitingActive
        expr: sum(rate(auth_login_rate_limited_total[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Logins are being rate limited"
          description: "Either an attack in progress, or a misconfigured client retrying."

      - alert: SessionCreationFailing
        expr: sum(rate(auth_session_creation_failures_total[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Token issuance is failing"
          description: "Users authenticate successfully but cannot obtain a session."

  # ==========================================================================
  # GPU — the silent-failure alerts
  # ==========================================================================
  - name: gpu
    rules:
      - alert: CudaProviderUnavailable
        # Gated on cpu_fallback_active so a CPU deployment, where
        # cuda_available is legitimately 0, never triggers this.
        expr: face_detector_cpu_fallback_active == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "GPU deployment is not using CUDA"
          description: >-
            CUDAExecutionProvider is not active. Inference still returns correct
            results, just far slower, and every other signal looks healthy —
            which is exactly why this needs an alert. Usually a CUDA/onnxruntime
            version mismatch: check that the pinned onnxruntime-gpu matches the
            base image CUDA major version.

      # NOTE: a second alert (InferenceRunningOnCPUInGpuMode) used to duplicate
      # CudaProviderUnavailable byte for byte — same expr, same duration, same
      # severity. One condition, one page.

      - alert: GpuMemoryNearlyExhausted
        expr: |
          face_detector_gpu_memory_total_bytes > 0
            and face_detector_gpu_memory_used_bytes
                / face_detector_gpu_memory_total_bytes > 0.92
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU memory above 92%"
          description: "CUDA OOM is likely. Reduce GPU_BATCH_SIZE or concurrency."

  # ==========================================================================
  # Background work and storage
  # ==========================================================================
  - name: capacity
    rules:
      - alert: ProcessingQueueBacklog
        # Percentage of the CONFIGURED capacity, not a hardcoded item count —
        # the old `> 1000` threshold silently meant 50% on the dev stack
        # (MAX_QUEUE_SIZE=2000) and 10% at the config default (10000).
        expr: |
          face_recognition_queue_capacity > 0
            and face_recognition_queue_size / face_recognition_queue_capacity > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Processing queue above 50% of capacity"
          description: "Queue at {{ $value | humanizePercentage }} of MAX_QUEUE_SIZE; ingestion is outrunning inference."

      - alert: ProcessingQueueNearFull
        expr: |
          face_recognition_queue_capacity > 0
            and face_recognition_queue_size / face_recognition_queue_capacity > 0.8
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Processing queue above 80% — 503s imminent"
          description: "At 100% every webhook frame is refused with 503 queue_full."

      - alert: EventLoopBlocked
        # WORKERS=1 is load-bearing: one blocked event loop stalls every
        # request, WebSocket and background task in the process at once.
        expr: face_recognition_event_loop_lag_seconds > 0.5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "asyncio event loop lag above 0.5s"
          description: "Something is blocking the single worker's event loop; all endpoints degrade together."

      - alert: DatabasePoolNearExhaustion
        expr: |
          fr_db_pool_size > 0
            and fr_db_pool_in_use / fr_db_pool_size > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "DB connection pool above 90% (incl. overflow use)"
          description: "New queries will start waiting on the pool; recognition latency follows."

      - alert: BackgroundServiceDown
        expr: fr_background_service_up == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Background service {{ $labels.service }} is not running"
          description: >-
            A supervised loop has been down for 10 minutes. These loops fail
            unevenly — retention or reconciliation stalling shows up nowhere
            else until data quietly ages or drifts.

      - alert: ProcessMemoryHigh
        expr: fr_process_rss_bytes > 6 * 1024 * 1024 * 1024
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "API process RSS above 6 GiB"
          description: "The container limit is 8 GiB; sustained growth here ends in the OOM killer."

      - alert: DiskSpaceLow
        expr: |
          face_detector_storage_total_bytes > 0
            and face_detector_storage_free_bytes
                / face_detector_storage_total_bytes < 0.10
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Under 10% storage remaining"
          description: "Image writes and database growth will fail once this reaches zero."

      - alert: ModelLoadFailure
        expr: face_detector_model_loaded == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Face recognition model is not loaded"

  # ==========================================================================
  # Backups and certificates
  # ==========================================================================
  - name: operations
    rules:
      - alert: BackupTooOld
        # The >0 guard matters: an unset gauge reads 0, and `time() - 0`
        # would fire this alert permanently in any deployment where the
        # backup directory is not visible to the API container.
        expr: |
          face_detector_last_backup_timestamp_seconds > 0
            and time() - face_detector_last_backup_timestamp_seconds > 172800
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "No successful backup in over 48 hours"
          description: >-
            Alerting on the age of the newest backup rather than on a failure
            event, so a backup job that silently stopped running still pages.

      - alert: CertificateExpiringSoon
        expr: |
          face_detector_tls_cert_expiry_timestamp_seconds > 0
            and (face_detector_tls_cert_expiry_timestamp_seconds - time()) / 86400 < 30
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate expires in under 30 days"
          description: >-
            Reissue with scripts/tls/make-internal-ca.sh. Clients need no change
            as long as the internal CA itself is unchanged.

      - alert: CertificateExpired
        expr: |
          face_detector_tls_cert_expiry_timestamp_seconds > 0
            and face_detector_tls_cert_expiry_timestamp_seconds - time() <= 0
        labels:
          severity: critical
        annotations:
          summary: "TLS certificate has expired — browsers will refuse to connect"
