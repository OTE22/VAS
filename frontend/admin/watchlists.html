<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Watchlist Management - Create and manage VIP, Threat, and POI watchlists">
    <meta name="author" content="ITDIR-AI DEPARTMENT">
    <meta name="robots" content="noindex, nofollow">
    
    <title>Watchlists - Admin Panel | Face Recognition Service</title>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/frontend/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/frontend/css/admin.css?v=nav-3">
    <link rel="stylesheet" href="/frontend/css/footer.css">
    <link rel="stylesheet" href="/frontend/css/admin-watchlists.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="intelligence-main-container" id="main-content">
        <div class="intelligence-grid-overlay"></div>
        <div class="intelligence-scan-line"></div>
        
        <div class="intelligence-content">
            <header class="page-header">
                <div class="header-content">
                    <div class="header-icon-wrapper">
                        <i class="fas fa-list-alt" aria-hidden="true"></i>
                        <div class="header-icon-glow"></div>
                    </div>
                    <div class="header-text">
                        <h1 class="page-title">Watchlist Management</h1>
                        <p class="page-description">Create and manage VIP, Threat, and POI watchlists</p>
                    </div>
                </div>
                <div class="header-actions">
                    <a href="/admin/search" class="intelligence-admin-btn">
                        <div class="btn-content">
                            <i class="fas fa-search"></i>
                            <span class="btn-title">SEARCH</span>
                        </div>
                    </a>
                </div>
            </header>

            <!-- Search / filters / sorting / pagination built by admin-watchlists.js -->
            <div id="watchlist-toolbar"></div>

            <div class="watchlist-grid" id="watchlist-grid">
                <!-- Create New Card (click wired in admin-watchlists.js — no inline handlers) -->
                <div class="watchlist-card create-card">
                    <i class="fas fa-plus"></i>
                    <span>Create New Watchlist</span>
                </div>
                <!-- Watchlists loaded dynamically -->
            </div>
        </div>
    </main>

    <!-- Create/Edit Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Create Watchlist</h2>
                <button class="modal-close" id="modal-close-btn" type="button" aria-label="Close dialog">&times;</button>
            </div>
            <form id="watchlist-form" class="watchlist-form">
                <input type="hidden" id="watchlist-id">
                <div class="form-group">
                    <label for="watchlist-name">Name *</label>
                    <input type="text" class="form-control" id="watchlist-name" required minlength="2" maxlength="100" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="watchlist-description">Description</label>
                    <textarea class="form-control" id="watchlist-description" rows="2" maxlength="1000"></textarea>
                </div>
                <div class="form-group">
                    <label>Alert Level</label>
                    <select class="form-control" id="watchlist-alert-level">
                        <option value="info">Info (Low Priority)</option>
                        <option value="warning">Warning (Medium Priority)</option>
                        <option value="critical">Critical (High Priority)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <div class="color-picker" id="color-picker">
                        <div class="color-option active" style="background: #6366f1" data-color="#6366f1"></div>
                        <div class="color-option" style="background: #00ff96" data-color="#00ff96"></div>
                        <div class="color-option" style="background: #0099ff" data-color="#0099ff"></div>
                        <div class="color-option" style="background: #ff4444" data-color="#ff4444"></div>
                        <div class="color-option" style="background: #ffcc00" data-color="#ffcc00"></div>
                        <div class="color-option" style="background: #ff8800" data-color="#ff8800"></div>
                        <div class="color-option" style="background: #aa00ff" data-color="#aa00ff"></div>
                        <div class="color-option" style="background: #ffffff" data-color="#ffffff"></div>
                    </div>
                </div>
                <button type="submit" class="submit-btn">
                    <i class="fas fa-save"></i> Save Watchlist
                </button>
            </form>
        </div>
    </div>

    <footer class="intelligence-footer">
        <div class="footer-content">
            <div class="footer-brand">
                <i class="fas fa-shield-alt"></i>
                <span>ITDIR-AI DEPARTMENT</span>
            </div>
            <div class="footer-copyright">© 2025 Face Recognition Service</div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="/frontend/js/actions.js?v=actions-1"></script>
    <script src="/frontend/js/navbar-loader.js?v=nav-5"></script>
    <script src="/frontend/js/admin-navbar.js"></script>
    <script src="/frontend/js/admin-watchlists.js?v=wl-2"></script>
</body>
</html>
